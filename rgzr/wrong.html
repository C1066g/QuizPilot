<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错题集 - AI 知识复习小程序</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 12px 24px;
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #e0e0e0;
            transform: translateX(-5px);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            color: #666;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.9;
        }

        .question-list {
            display: grid;
            gap: 25px;
        }

        .question-item {
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .question-item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.15);
        }

        .question-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .question-number {
            font-size: 1.2rem;
            font-weight: bold;
            color: #667eea;
        }

        .question-type {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .question-text {
            font-size: 1.1rem;
            color: #333;
            line-height: 1.8;
            margin: 15px 0;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }

        .options {
            margin: 15px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 1rem;
        }

        .option {
            padding: 8px 0;
            line-height: 1.6;
        }

        .option.correct {
            color: #4CAF50;
            font-weight: bold;
        }

        .option.wrong {
            color: #f44336;
            font-weight: bold;
        }

        .answer-box {
            margin: 15px 0;
            padding: 15px;
            background: #e8f5e9;
            border-left: 4px solid #4CAF50;
            border-radius: 8px;
        }

        .answer-label {
            color: #2e7d32;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .answer-text {
            color: #555;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .user-answer-box {
            margin: 15px 0;
            padding: 15px;
            background: #ffebee;
            border-left: 4px solid #f44336;
            border-radius: 8px;
        }

        .user-answer-label {
            color: #c62828;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .empty-state p {
            font-size: 1.2rem;
            color: #666;
        }

        .controls {
            text-align: center;
            margin-bottom: 30px;
        }

        .controls button {
            margin: 0 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .question-item {
                padding: 15px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← 返回主页</a>

        <div class="header">
            <h1>❌ 错题集</h1>
            <p>复习你的错题，查看正确答案和详细解析</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="wrongCount">0</div>
                <div class="stat-label">错题数量</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">总题数</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="reviewAllWrong()">📝 复习所有错题</button>
            <button class="btn btn-secondary" onclick="clearAllWrong()">🗑️ 清空错题集</button>
        </div>

        <div class="question-list" id="wrongList"></div>
    </div>

    <script src="questions-part1.js"></script>
    <script src="questions-part2.js"></script>
    <script src="questions-part3.js"></script>
    <script src="questions-part4.js"></script>
    <script src="questions-exchange.js"></script>
    <script src="questions-linux.js"></script>

    <script>
        let allQuestions = [];
        let wrongQuestions = new Map();
        const currentSubject = localStorage.getItem('currentSubject') || 'ai';
        const SUBJECTS = {
            ai: {
                name: '人工智能',
                getQuestions: () => [...questionsPart1, ...questionsPart2, ...questionsPart3, ...questionsPart4]
            },
            exchange: {
                name: '现代交换原理',
                getQuestions: () => questionsExchange || []
            },
            linux: {
                name: 'Linux 技术应用',
                getQuestions: () => questionsLinux || []
            }
        };

        function getProgressKey() {
            return `quizProgress_${currentSubject}`;
        }

        // 初始化
        function initWrong() {
            allQuestions = SUBJECTS[currentSubject]?.getQuestions() || [];
            loadWrongQuestions();
            renderWrongList();
        }

        // 从 localStorage 加载错题集
        function loadWrongQuestions() {
            const saved = localStorage.getItem(getProgressKey());
            if (saved) {
                const progress = JSON.parse(saved);
                wrongQuestions = new Map(progress.wrongQuestions || []);
            }
        }

        // 获取题型标签
        function getTypeLabel(type) {
            const labels = {
                'single': '单选题',
                'multiple': '多选题',
                'fill': '填空题',
                'judge': '判断题',
                'essay': '简答题'
            };
            return labels[type] || type;
        }

        // 渲染错题列表
        function renderWrongList() {
            const list = document.getElementById('wrongList');
            const count = document.getElementById('wrongCount');
            const total = document.getElementById('totalCount');

            list.innerHTML = '';
            count.textContent = wrongQuestions.size;
            total.textContent = allQuestions.length;

            if (wrongQuestions.size === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🎉</div><p>太棒了！没有错题，继续加油！</p></div>';
                return;
            }

            wrongQuestions.forEach((wrongData, questionId) => {
                const question = wrongData.question;
                const div = document.createElement('div');
                div.className = 'question-item';

                // 构建选项显示（如果是选择题）
                let optionsHtml = '';
                if (question.type === 'single' || question.type === 'multiple') {
                    optionsHtml = '<div class="options">';
                    question.options.forEach((option, idx) => {
                        const letter = String.fromCharCode(65 + idx);
                        const isCorrect = letter === question.answer;
                        const isUserAnswer = letter === wrongData.userAnswer;
                        let className = 'option';
                        if (isCorrect) {
                            className += ' correct';
                        } else if (isUserAnswer) {
                            className += ' wrong';
                        }
                        optionsHtml += `<div class="${className}">${letter}、${option}</div>`;
                    });
                    optionsHtml += '</div>';
                }

                // 构建用户答案显示
                let userAnswerHtml = '';
                if (wrongData.userAnswer) {
                    userAnswerHtml = `
                        <div class="user-answer-box">
                            <div class="user-answer-label">✗ 你的答案：${wrongData.userAnswer}</div>
                        </div>
                    `;
                }

                // 构建答案显示
                const answerHtml = `
                    <div class="answer-box">
                        <div class="answer-label">✓ 正确答案：${question.answer}</div>
                        <div class="answer-text">${question.answerText}</div>
                    </div>
                `;

                div.innerHTML = `
                    <div class="question-header">
                        <span class="question-number">第 ${question.id} 题</span>
                        <span class="question-type">${getTypeLabel(question.type)}</span>
                    </div>
                    <div class="question-text">${question.question}</div>
                    ${optionsHtml}
                    ${userAnswerHtml}
                    ${answerHtml}
                    <div class="button-group">
                        <button class="btn btn-primary" onclick="goToPractice(${question.id})">再练一遍</button>
                        <button class="btn btn-secondary" onclick="removeWrong(${question.id})">移除</button>
                    </div>
                `;

                list.appendChild(div);
            });
        }

        // 进入练习模式
        function goToPractice(questionId) {
            window.location.href = `index.html?question=${questionId}`;
        }

        // 从错题集中移除单个题目
        function removeWrong(questionId) {
            wrongQuestions.delete(questionId);
            saveWrongQuestions();
            renderWrongList();
        }

        // 复习所有错题
        function reviewAllWrong() {
            if (wrongQuestions.size === 0) {
                alert('没有错题，继续加油！');
                return;
            }
            window.location.href = `index.html?reviewWrong=true`;
        }

        // 清空所有错题
        function clearAllWrong() {
            if (confirm('确定要清空所有错题吗？')) {
                wrongQuestions.clear();
                saveWrongQuestions();
                renderWrongList();
                alert('已清空错题集');
            }
        }

        // 保存错题集到 localStorage
        function saveWrongQuestions() {
            const saved = localStorage.getItem(getProgressKey());
            const progress = saved ? JSON.parse(saved) : {};
            progress.wrongQuestions = Array.from(wrongQuestions.entries());
            localStorage.setItem(getProgressKey(), JSON.stringify(progress));
        }

        // 页面加载时初始化
        window.onload = initWrong;
    </script>
</body>
</html>
